name: Build EarnX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract EarnX project
        run: |
          unzip -o EarnX-AndroidIDE-ready.zip -d earnx_project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: earnx_project/EarnX_cap
        run: |
          npm install
          npm install -D typescript
          npm install @capacitor/android@^7.4.3

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        working-directory: earnx_project/EarnX_cap
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
          else
            echo "sdkmanager not found, continuing..."
          fi

      - name: Build Debug APK
        working-directory: earnx_project/EarnX_cap/android
        run: |
          chmod +x ./grad
